name = "server-updater"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "BINARIES_BUCKET"
bucket_name = "app-updates-dev"
preview_bucket_name = "app-updates-dev-preview"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[vars]
ADMIN_USERNAME = "admin"
# In local/preview dev, these can have sensible defaults.
# For remote deployments, configure via: wrangler secret put ADMIN_PASSWORD
ADMIN_PASSWORD = "admin"
UPLOAD_AUTH_KEY = ""
